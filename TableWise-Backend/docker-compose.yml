services:
  mongodb:
    image: mongo
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - db:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - backend-net
  app:
    depends_on:
      - mongodb
    build: ./TableWiseBackend
    restart: unless-stopped
    env_file: ./.env
    ports:
      - $NODE_LOCAL_PORT:$NODE_DOCKER_PORT
    environment:
      - DB_HOST=mongodb
      - DB_NAME=$MONGODB_DATABASE
      - DB_PORT=$MONGODB_DOCKER_PORT
    command: npm run setup
    volumes:
      - ./TableWiseBackend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - backend-net
volumes:
  db:

networks:
  backend-net:
    driver: bridge
    internal: true
